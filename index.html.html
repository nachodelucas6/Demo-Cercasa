  function Sparkline(props) {
    var data = props.data || [3, 5, 4, 7, 6, 9, 8, 11, 10, 13];
    var w = 80, hh = 28;
    var max = Math.max.apply(null, data), min = Math.min.apply(null, data);
    var pts = data.map(function(v, i) {
      var x = (i / (data.length - 1)) * w;
      var y = hh - ((v - min) / (max - min || 1)) * hh;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return h('svg', { width: w, height: hh, className: 'sparkline' },
      h('polyline', { points: pts, fill: 'none', stroke: props.color || '#53B487', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' })
    );
  }

  function CounterValue(props) {
    var target = props.target || 0;
    var suffix = props.suffix || '';
    var prefix = props.prefix || '';
    var dur = 1000;
    var ref = useRef(target);
    var anchor = useState(0)[1];
    var current = useState(0);
    useEffect(function() {
      var start = 0, t0 = performance.now();
      function step(t) {
        var p = Math.min(1, (t - t0) / dur);
        var v = Math.floor(start + (target - start) * (1 - Math.pow(1 - p, 3)));
        current[1](v);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, []);
    return h('span', null, prefix + (current[0]).toLocaleString('es-ES') + suffix);
  }

            h('div', { className: 'text-[11px] text-gray-400 mb-3' }, 'WhatsApp · Laura Sanchis (inquilina)')
          ),
          h(PhoneMockup, { msgs: visible, typing: typing })
        )
      )
    );
  }

  // ─────────────────────────────────────────────────────────────
  // COMPONENT · AsistenteView
  // ─────────────────────────────────────────────────────────────
  var PRESETS = [
    {
      id: 'venciendo',
      label: 'Alquileres venciendo en los próximos 90 días',
      icon: I.alert,
      respuesta: 'Tienes 18 alquileres venciendo en los próximos 90 días:\n\n· 4 CRÍTICOS (≤30 días) — IA ya inició sondeo en 3 de ellos. El cuarto (C/ Cirilo Amorós 90, María Llinares) no ha contestado · te lo escalo a Patricia hoy mismo.\n\n· 6 URGENTES (31-90 días) — IA cierra primera ronda de sondeo entre hoy y el viernes. 2 tienen perfil VIP (3+ años, pago puntual, sin incidencias) · candidatos compra fuertes.\n\n· 8 PRÓXIMOS (91-180 días) — entran en cola IA la semana del 8 de junio.\n\nPropuesta: bloquear 30 min mañana con Patricia y Liliana para revisar conmigo los 4 críticos uno por uno.',
    },
    {
      id: 'leads',
      label: 'Leads Meta Ads cualificados esta semana',
      icon: I.target,
      respuesta: '47 leads esta semana · 32% cualificados (15) · 6% basura descartados (3) · 62% en proceso (29).\n\nTop 5 cualificados pendientes de asignar:\n\n1. María Tortajada Ferrer · Russafa 220k · score 88 · ASIGNADA Germán\n2. Pedro Catalá Soler · Local Patraix 350k · score 91 · ASIGNADO Germán (URGENTE)\n3. Inversiones Hispania SL · Edificio Russafa 1.8M · score 96 · ASIGNADO César\n4. José Llinares Beneyto · Benimaclet 165k · score 82 · ASIGNADO Román\n5. Luis Marí Bayarri · Campanar 295k · score 71 · ASIGNADO Román\n\n¿Quieres que Roxxana suba ya estos 5 a portales con prioridad? Te genero los anuncios.',
    },
    {
      id: 'vip',
      label: 'Inquilinos con potencial de compra',
      icon: I.star,
      respuesta: 'Detecté 12 inquilinos con perfil VIP candidato a compra (≥3 años en piso + pago puntual + estabilidad declarada):\n\n· Laura Sanchis · Av. Primado Reig 48 · 3 años · Patricia · YA en proceso\n· Andrea Sancho · Reina Doña Germana 5 · 2 años · Patricia · alta probabilidad\n· Familia Catalá · Pl. Cánovas 4 · 3 años · sin contactar · activa sondeo IA\n· Familia Llinares · Godella Campo Olivar 12 · 2 años · sin contactar · alta probabilidad\n\nValor potencial agregado: 1.230.000 €. Comisión estimada Cercasa (3% promedio): 36.900 €.\n\n¿Activamos sondeo IA en los 8 que aún están sin contactar?',
    },
    {
      id: 'valoracion',
      label: 'Generar valoración orientativa de un inmueble',
      icon: I.euro,
      respuesta: 'Cuéntame el inmueble (dirección o barrio · m² · habitaciones · estado · planta si lo sabes) y te devuelvo rango orientativo basado en transacciones reales últimos 12 meses en la zona, ajustado con datos de portales y nuestra BBDD interna.\n\nEjemplo: "Russafa 3 hab 85m² 2ª planta a reformar"\n→ Rango: 195.000 - 220.000 €.\n→ Tiempo medio venta: 45-60 días.\n→ Mejora del 12% si reformamos antes (ROI 4x).',
    },
  ];

  function AsistenteView() {
    var [selected, setSelected] = useState(null);
    var [streaming, setStreaming] = useState('');
    var [streamingIdx, setStreamingIdx] = useState(0);
    var [inputValue, setInputValue] = useState('');
    var [historial, setHistorial] = useState([]);

    useEffect(function() {
      if (!selected) return;
      setStreaming('');
      setStreamingIdx(0);
      var preset = PRESETS.filter(function(p) { return p.id === selected; })[0];
      var full = preset.respuesta;
      var i = 0;
      var timer = setInterval(function() {
        i += 3;
        setStreamingIdx(i);
        if (i >= full.length) { clearInterval(timer); }
      }, 20);
      return function() { clearInterval(timer); };
    }, [selected]);

    var preset = PRESETS.filter(function(p) { return p.id === selected; })[0];
    var displayedText = preset ? preset.respuesta.slice(0, streamingIdx) : '';
    var stillStreaming = preset && streamingIdx < preset.respuesta.length;

    function enviarLibre() {
      if (!inputValue.trim()) return;
      var q = inputValue.trim();
      var r;
      var ql = q.toLowerCase();
      if (ql.indexOf('russafa') >= 0 || ql.indexOf('benimaclet') >= 0 || ql.indexOf('valoración') >= 0 || ql.indexOf('cuánto vale') >= 0) {
        r = 'Russafa zona alta demanda · rango orientativo según m² y estado: 2.400-3.100 €/m² para reformado · 1.900-2.450 €/m² para a reformar. Te lo afino si me dices dirección concreta o m².';
      } else if (ql.indexOf('comisión') >= 0 || ql.indexOf('comision') >= 0) {
        r = 'Comisiones medias del mercado Valencia · venta: 3-5% del precio + IVA · alquiler: 1 mensualidad al propietario + 1 al inquilino. Las que aplica Cercasa exactamente las tienes en la ficha "Servicios" del CRM cuando lo abras con cliente real.';
      } else if (ql.indexOf('inquilino') >= 0 && (ql.indexOf('compra') >= 0 || ql.indexOf('venta') >= 0)) {
        r = 'Hay 12 inquilinos con perfil VIP candidatos a compra ahora mismo (≥3 años + pago puntual). 4 ya están en proceso activo con la IA. ¿Quieres que active sondeo en los otros 8?';
      } else if (ql.indexOf('germán') >= 0 || ql.indexOf('german') >= 0) {
        r = 'Germán Martínez tiene hoy: 2 visitas (Russafa 220k María Tortajada · Local Patraix Pedro Catalá), 4 leads cualificados pendientes de primer contacto y 1 reunión interna con Carlos (financiero) por la simulación Laura Sanchis. Carga estimada del día: 7,5h.';
      } else {
        r = 'No tengo todavía datos suficientes para responderte con concreción a esa pregunta. En una implementación real esto consultaría a Trello/CRM, datos de mercado de los portales en directo y conversaciones históricas con los clientes mencionados. ¿Reformulas o pruebas con otro de los 4 botones de arriba?';
      }
      setHistorial([{ q: q, r: r }].concat(historial));
      setInputValue('');
    }

    return h('div', { className: 'p-5 md:p-8 space-y-6 max-w-[1400px] mx-auto' },
      h('div', null,
        h('h2', { className: 'text-xl md:text-2xl font-bold text-gray-900 flex items-center gap-2' },
          h('span', { className: 'text-cercasa-600' }, h(Icon, { d: I.sparkles, size: 24 })),
          'Asistente IA · 4 acciones rápidas + chat libre'
        ),
        h('p', { className: 'text-sm text-gray-500 mt-1 max-w-3xl' },
          'Pregunta libre a la IA con contexto completo del sistema (cartera, leads, alquileres, BBDD, comerciales asignados). 4 acciones rápidas para los 4 dolores top.'
        )
      ),

      h('div', { className: 'grid md:grid-cols-2 gap-3' },
        PRESETS.map(function(p) {
          return h('button', {
            key: p.id,
            onClick: function() { setSelected(p.id); },
            className: cls(
              'flex items-center gap-3 p-4 rounded-xl border-2 text-left transition-all',
              selected === p.id ? 'border-cercasa-500 bg-cercasa-50' : 'border-gray-200 bg-white hover:border-cercasa-300'
            ),
          },
            h('div', { className: 'w-10 h-10 rounded-lg bg-cercasa-100 text-cercasa-700 flex items-center justify-center flex-shrink-0' }, h(Icon, { d: p.icon, size: 20 })),
            h('div', { className: 'flex-1' },
              h('div', { className: 'font-semibold text-gray-900 text-sm' }, p.label),
              h('div', { className: 'text-xs text-gray-500 mt-0.5' }, selected === p.id ? 'IA respondiendo…' : 'Click para preguntar')
            )
          );
        })
      ),

      selected && h('div', { className: 'bg-white rounded-2xl p-5 md:p-6 border-2 border-cercasa-200 shadow-sm anim-fade' },
        h('div', { className: 'flex items-center gap-2 mb-3 text-xs text-cercasa-700 font-semibold uppercase tracking-wide' },
          h('span', { className: 'w-2 h-2 rounded-full bg-cercasa-500', style: stillStreaming ? { animation: 'pulse 1.5s infinite' } : null }),
          stillStreaming ? 'Generando respuesta…' : 'Respuesta IA',
          stillStreaming && h('span', { className: 'text-gray-400 normal-case font-normal' }, '(consultando CRM + datos de mercado…)')
        ),
        h('div', {
          className: cls('text-gray-800 whitespace-pre-line leading-relaxed text-sm md:text-base', stillStreaming && 'typing-cursor'),
        }, displayedText)
      ),

      h('div', { className: 'bg-white rounded-2xl p-4 border border-gray-200 shadow-sm' },
        h('div', { className: 'flex gap-2' },
          h('input', {
            type: 'text',
            value: inputValue,
            onChange: function(e) { setInputValue(e.target.value); },
            onKeyDown: function(e) { if (e.key === 'Enter') enviarLibre(); },
            placeholder: 'Pregunta libre · ej: "¿qué tiene hoy Germán?", "valoración Russafa 3 hab", "inquilinos con potencial de compra"',
            className: 'flex-1 px-4 py-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-cercasa-500',
          }),
          h('button', {
            onClick: enviarLibre,
            className: 'bg-cercasa-500 hover:bg-cercasa-600 text-white px-5 rounded-lg font-semibold text-sm flex items-center gap-2 transition-colors',
          },
            h(Icon, { d: I.send, size: 16 }),
            'Preguntar'
          )
        ),
        h('div', { className: 'text-[11px] text-gray-400 mt-2 px-1' }, 'Sugerencias contextuales: ¿Te ayudo a generar la valoración del piso de María Tortajada? · ¿Activo sondeo en los 8 VIP pendientes?')
      ),

      historial.length > 0 && h('div', { className: 'space-y-3' },
        historial.map(function(it, i) {
          return h('div', { key: i, className: 'space-y-2 anim-fade' },
            h('div', { className: 'bg-cercasa-50 rounded-xl px-4 py-3 text-sm font-medium text-cercasa-900 ml-12' }, it.q),
            h('div', { className: 'bg-white rounded-xl px-4 py-3 text-sm text-gray-700 border border-gray-100 mr-12 shadow-sm' }, it.r)
          );
        })
      )
    );
  }

  // ─────────────────────────────────────────────────────────────
  // COMPONENT · TourGuiado
  // ─────────────────────────────────────────────────────────────
  function TourGuiado(props) {
    return h('div', { className: 'tour-spotlight', onClick: props.onClose },
      h('div', { className: 'tour-box', onClick: function(e) { e.stopPropagation(); } },
        h('div', { className: 'flex items-center gap-3 mb-3' },
          h('div', { className: 'w-10 h-10 rounded-full bg-cercasa-100 text-cercasa-700 flex items-center justify-center' }, h(Icon, { d: I.sparkles, size: 22 })),
          h('div', null,
            h('div', { className: 'font-bold text-gray-900' }, 'Bienvenido a la demo de Cercasa'),
            h('div', { className: 'text-xs text-gray-500' }, 'Prototipo visual · Iván Fyzon · 26 may 2026')
          )
        ),
        h('p', { className: 'text-sm text-gray-700 leading-relaxed mb-3' },
          'Esta demo ataca los ', h('strong', null, '3 frentes'), ' que comentamos:'
        ),
        h('ul', { className: 'space-y-2 mb-4 text-sm text-gray-700' },
          h('li', { className: 'flex items-start gap-2' },
            h('span', { className: 'text-cercasa-600 mt-0.5' }, '›'),
            h('span', null, h('strong', null, 'Captador IA'), ' (estrella) · cualifica leads Meta Ads con cadencia multicanal real')
          ),
          h('li', { className: 'flex items-start gap-2' },
            h('span', { className: 'text-cercasa-600 mt-0.5' }, '›'),
            h('span', null, h('strong', null, 'Alquileres + alertas'), ' · 2.014 contratos con badge por vencimiento')
          ),
          h('li', { className: 'flex items-start gap-2' },
            h('span', { className: 'text-cercasa-600 mt-0.5' }, '›'),
            h('span', null, h('strong', null, 'Agente Renovación'), ' · sondea al inquilino a T-90 días para conversión a comprador')
          ),
          h('li', { className: 'flex items-start gap-2' },
            h('span', { className: 'text-cercasa-600 mt-0.5' }, '›'),
            h('span', null, h('strong', null, 'Asistente IA'), ' · pregunta libre sobre toda la operativa')
          )
        ),
        h('div', { className: 'bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 mb-4' },
          h('strong', null, '⚠ Es un prototipo. '),
          'Está hecho para validar contigo si entendemos bien vuestra operativa. Lo que veas y no encaje · lo cambiamos en la siguiente versión.'
        ),
        h('button', {
          onClick: props.onClose,
          className: 'w-full bg-cercasa-500 hover:bg-cercasa-600 text-white font-semibold py-2.5 rounded-lg transition-colors',
        }, 'Vamos a verlo')
      )
    );
  }

  // ─────────────────────────────────────────────────────────────
  // APP ROOT
  // ─────────────────────────────────────────────────────────────
  function App() {
    var [user, setUser] = useState(null);
    var [view, setView] = useState('dashboard');
    var [sidebarExpanded, setSidebarExpanded] = useState(window.innerWidth > 768);
    var [tourShown, setTourShown] = useState(false);
    var [notifs, setNotifs] = useState([NOTIFS[0]]);

    useEffect(function() {
      var saved = loadState();
      if (saved.user) {
        var found = USERS.filter(function(u) { return u.id === saved.user; })[0];
        if (found) setUser(found);
      }
      if (saved.tourShown) setTourShown(true);
    }, []);

    useEffect(function() {
      if (!user) return;
      // Drip de notifs
      var idx = 1;
      var timer = setInterval(function() {
        if (idx >= NOTIFS.length) { clearInterval(timer); return; }
        setNotifs(function(arr) { return arr.concat([NOTIFS[idx]]); });
        idx++;
      }, 6500);
      return function() { clearInterval(timer); };
    }, [user]);

    function login(u) {
      setUser(u);
      saveState({ user: u.id });
    }
    function logout() {
      setUser(null);
      saveState({ user: null });
    }
    function closeTour() {
      setTourShown(true);
      saveState({ tourShown: true });
    }

    if (!user) return h(LoginScreen, { onLogin: login });

    var titles = {
      dashboard:  { t: 'Dashboard', s: 'Vista panorámica de la operativa Cercasa' },
      captador:   { t: 'Captador IA · Venta', s: 'Comercial IA #1 · pipeline de leads' },
      alquileres: { t: 'Alquileres activos',  s: '2.014 contratos · alertas vencimiento' },
      renovacion: { t: 'Agente Renovación',   s: 'Comercial IA #2 · venta al inquilino' },
      asistente:  { t: 'Asistente IA',        s: 'Pregunta libre sobre toda la operativa' },
    };

    return h(Fragment, null,
      h('div', { className: 'flex min-h-screen' },
        h(Sidebar, { view: view, setView: setView, expanded: sidebarExpanded, setExpanded: setSidebarExpanded, user: user, onLogout: logout }),
        h('div', { className: 'flex-1 min-w-0 flex flex-col' },
          h(Topbar, { title: titles[view].t, subtitle: titles[view].s, user: user }),
          h('main', { className: 'flex-1 bg-gray-50 overflow-y-auto' },
            view === 'dashboard'  && h(DashboardView,  { user: user, notifs: notifs }),
            view === 'captador'   && h(CaptadorView,   {}),
            view === 'alquileres' && h(AlquileresView, { setView: setView }),
            view === 'renovacion' && h(RenovacionView, {}),
            view === 'asistente'  && h(AsistenteView,  {})
          )
        )
      ),
      !tourShown && h(TourGuiado, { onClose: closeTour })
    );
  }

  // RENDER
  try {
    var rootEl = document.getElementById('root');
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App));
    setTimeout(function() {
      var loader = document.getElementById('initial-loader');
      if (loader) loader.style.transition = 'opacity 0.3s';
      if (loader) loader.style.opacity = '0';
      setTimeout(function() { if (loader) loader.remove(); }, 300);
    }, 150);
  } catch (err) {
    window.onerror && window.onerror(err.message, '', 0, 0, err);
  }
})();
</script>

</body>
</html>
